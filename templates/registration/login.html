{% extends 'base.html' %}{% block title %}Staff Login — Classio{% endblock %}{% block content %}<section class="login-page"><form method="post" class="login-card stacked-form">{% csrf_token %}<div class="kicker">CLASSIO ADMINISTRATION</div><h1>Welcome <em>back.</em></h1>{% if form.errors %}<div class="alert error">Incorrect username or password.</div>{% endif %}<label>Username {{ form.username }}</label><label>Password {{ form.password }}</label><input type="hidden" name="next" value="{{ next }}"><button class="btn btn-dark full" type="submit">SIGN IN ↗</button><p class="muted">Authorized staff accounts only.</p></form></section>{% endblock %}
