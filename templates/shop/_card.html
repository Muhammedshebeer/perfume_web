{% load static %}
<article class="product-card"><a class="product-photo" href="{{ p.get_absolute_url }}">
{% if p.image %}<img loading="lazy" src="{{ p.image.url }}" alt="{{ p.main_alt }}">{% else %}<img loading="lazy" src="{% static 'img/fallback.svg' %}" alt="Classio fragrance image placeholder">{% endif %}
{% if p.is_featured %}<span class="photo-tag">CURATED</span>{% endif %}</a>
<div class="product-card-info"><div class="eyebrow">{{ p.brand.name }}</div><h3><a href="{{ p.get_absolute_url }}">{{ p.name }}</a></h3><div class="price">AED {{ p.price }} {% if p.compare_at_price %}<del>AED {{ p.compare_at_price }}</del>{% endif %}</div></div></article>
